name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s scripts -p 'test_probe*.py' -v
      - run: python3 -m compileall -q scripts
  rust:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.10-bookworm
        env:
          POSTGRES_USER: mvm
          POSTGRES_DB: mvm_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U mvm -d mvm_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo test -p mvm-coordinator --locked --tests -- --ignored --test-threads=1
        env:
          MVM_TEST_DATABASE_URL: postgres://mvm@localhost:5432/mvm_test
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: node scripts/generate-contract.mjs --check
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
