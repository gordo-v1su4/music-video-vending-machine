name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: docker build -f deploy/Dockerfile --target coordinator -t mvvm-coordinator:ci .
      - run: docker run --rm --read-only --cap-drop ALL --security-opt no-new-privileges mvvm-coordinator:ci --openapi > /tmp/mvvm-openapi.json
      - run: python3 -c 'import json; assert "/api/v1/projects" in json.load(open("/tmp/mvvm-openapi.json"))["paths"]'
      - run: docker build -f deploy/Dockerfile --target web --build-arg VITE_API_ORIGIN=https://app-vm.tail7fdbe2.ts.net:8443 -t mvvm-web:ci .
      - name: Smoke test restricted web container
        shell: bash
        run: |
          set -euo pipefail
          trap 'docker rm -f mvvm-web-ci >/dev/null 2>&1 || true' EXIT
          docker run -d --name mvvm-web-ci --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /data --tmpfs /config --add-host coordinator:127.0.0.1 -p 127.0.0.1::8080 mvvm-web:ci
          address=$(docker port mvvm-web-ci 8080/tcp)
          curl --retry 10 --retry-all-errors --retry-delay 1 --max-time 10 --fail --silent --show-error "http://$address/" > /tmp/mvvm-web.html
          test "$(docker exec mvvm-web-ci id -u)" = 10001
          grep -q '<html' /tmp/mvvm-web.html
          test "$(curl --max-time 10 --silent -o /dev/null -w '%{http_code}' "http://$address/api/v1/health")" = 502
          curl --fail --silent "http://$address/" > /dev/null
  backup-acl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - shell: pwsh
        run: ./scripts/test-backup-acl.ps1
  probes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: python3 -m unittest discover -s scripts -p 'test_probe*.py' -v
      - run: python3 -m compileall -q scripts
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run check:convex
      - run: bunx vitest run scripts/convex-migration.test.ts scripts/convex-persistence.test.ts
      - run: node --test scripts/migration-payloads.test.mjs scripts/convex-backup.test.mjs scripts/scheduled-backup.test.mjs
      - run: node scripts/test-convex-http.mjs
      - run: bun install --frozen-lockfile
        working-directory: apps/web
      - run: node scripts/generate-contract.mjs --check
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.3.14'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run test
      - run: bun run build
