name: mvvm-studio
services:
  coordinator:
    image: ${MVVM_COORDINATOR_IMAGE:?Use a reviewed immutable image tag}
    restart: unless-stopped
    env_file: ${MVVM_PRIVATE_ENV:?Absolute private env path required}
    environment:
      MVM_DEV_LOCAL: "0"
      MVM_BIND: 0.0.0.0:5199
      MVM_ALLOWED_ORIGINS: https://app-vm.tail7fdbe2.ts.net:8443,tauri://localhost,http://tauri.localhost
      CONVEX_SELF_HOSTED_URL: http://100.118.78.13:13210
      MVM_S3_ENDPOINT: https://s3.v1su4.dev
      MVM_S3_BUCKET: mvvm
      MVM_S3_REGION: us-east-1
      RUST_LOG: mvm_coordinator=info
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    stop_grace_period: 30s
    mem_limit: 1g
    cpus: 2
  web:
    image: ${MVVM_WEB_IMAGE:?Use a reviewed immutable image tag}
    restart: unless-stopped
    depends_on:
      coordinator:
        condition: service_healthy
    ports:
      - "127.0.0.1:13220:8080"
    read_only: true
    tmpfs:
      - /data
      - /config
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    mem_limit: 128m
    cpus: 1
